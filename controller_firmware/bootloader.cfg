MEMORY {
    ZP:  start = $02,   size = $1A,   type = rw, define = yes;
	ROM: start = $C000, size = $4000, type = ro, define = yes, file = "bootloader.bin";
    RAM: start = $A000,  size = $1000, define = yes;
}
SEGMENTS {
    STARTUP: load = ROM, type = ro;
	ONCE: load = ROM, type = ro, optional = yes;
	LOWCODE: load = ROM, type = ro, optional = yes;
	CODE: load = ROM, type = ro, define = yes;
    RODATA: load = ROM, type = ro, define = yes;
    DATA: load = ROM, run = RAM, type = rw, define = yes;
    BSS: load = RAM, type = bss, define = yes;
    ZEROPAGE: load = ZP, type = zp;
	VECTORS: load = ROM, type = ro, start = $FFFC;
}
FEATURES {
    CONDES: segment = RODATA,
	    type = constructor,
	    label = __CONSTRUCTOR_TABLE__,
	    count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
	    type = destructor,
	    label = __DESTRUCTOR_TABLE__,
	    count = __DESTRUCTOR_COUNT__;
}
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $800;  # 2K stack
    __STACKSTART__: type = weak, value = $B000; # unused, satisfies none/crt0.s
}
